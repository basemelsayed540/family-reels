name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "supabase/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secret
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.lammatna --project-name lammatna .
          git checkout -- lib pubspec.yaml

      - name: Patch Android project
        run: python3 scripts/patch_android.py

      - name: Restore keystore
        run: |
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/lammatna.jks.enc -out "$RUNNER_TEMP/lammatna.jks" -pass env:KEYSTORE_PASSWORD; then
            echo "::error::KEYSTORE_PASSWORD is wrong or has extra spaces. Re-save it exactly as in GitHub-secrets.txt."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/lammatna.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Keystore could not be opened with KEYSTORE_PASSWORD."
            exit 1
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/lammatna.jks
          KEY_ALIAS: lammatna
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/lammatna.apk
          cat > out/version.json <<EOF
          {"build": ${{ github.run_number }}, "name": "1.0.${{ github.run_number }}", "apk_url": "https://github.com/${{ github.repository }}/releases/download/latest-apk/lammatna.apk"}
          EOF
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk out/lammatna.apk out/version.json \
            --title "لمّتنا" \
            --notes "آخر نسخة من تطبيق لمّتنا (رقم البناء ${{ github.run_number }})" \
            --latest
